<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PDF Tools Online Gratis</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fa;
  text-align: center;
  padding: 30px;
}

h1 {
  font-size: 35px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  width: 300px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

button {
  background: #007bff;
  color: white;
  border: none;
  padding: 10px 20px;
  margin-top: 10px;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: #0056b3;
}

.status {
  margin-top: 10px;
  color: green;
}
</style>
</head>

<body>

<h1>PDF Tools Online Gratis</h1>
<p>Unir, dividir y trabajar con PDF fácilmente</p>

<div class="container">

<!-- UNIR PDF -->
<div class="card">
  <h3>Unir PDF</h3>
  <input id="mergeInput" type="file" multiple accept="application/pdf"><br>
  <button onclick="mergePDFs()">Unir PDF</button>
  <p class="status" id="mergeStatus"></p>
</div>

<!-- DIVIDIR PDF -->
<div class="card">
  <h3>Dividir PDF</h3>
  <input id="splitInput" type="file" accept="application/pdf"><br>
  <input id="pages" placeholder="Ej: 1-2,4"><br>
  <button onclick="splitPDF()">Dividir PDF</button>
  <p class="status" id="splitStatus"></p>
</div>

</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>

// UNIR PDF
async function mergePDFs() {
  const files = document.getElementById("mergeInput").files;
  const status = document.getElementById("mergeStatus");

  if (files.length < 2) {
    alert("Selecciona mínimo 2 PDFs");
    return;
  }

  status.innerText = "Procesando...";

  const mergedPdf = await PDFLib.PDFDocument.create();

  for (let file of files) {
    const bytes = await file.arrayBuffer();
    const pdf = await PDFLib.PDFDocument.load(bytes);
    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
    pages.forEach(p => mergedPdf.addPage(p));
  }

  const mergedBytes = await mergedPdf.save();

  downloadFile(mergedBytes, "pdf-unido.pdf");
  status.innerText = "✅ PDF unido";
}


// DIVIDIR PDF
async function splitPDF() {
  const file = document.getElementById("splitInput").files[0];
  const pagesInput = document.getElementById("pages").value;
  const status = document.getElementById("splitStatus");

  if (!file || !pagesInput) {
    alert("Sube PDF y escribe páginas");
    return;
  }

  status.innerText = "Procesando...";

  const bytes = await file.arrayBuffer();
  const pdf = await PDFLib.PDFDocument.load(bytes);
  const newPdf = await PDFLib.PDFDocument.create();

  let pages = parsePages(pagesInput);

  const copied = await newPdf.copyPages(pdf, pages);
  copied.forEach(p => newPdf.addPage(p));

  const newBytes = await newPdf.save();

  downloadFile(newBytes, "pdf-dividido.pdf");
  status.innerText = "✅ PDF dividido";
}


// PARSEAR PAGINAS
function parsePages(input) {
  let result = [];
  let parts = input.split(",");

  parts.forEach(part => {
    if (part.includes("-")) {
      let [start, end] = part.split("-").map(Number);
      for (let i = start; i <= end; i++) result.push(i - 1);
    } else {
      result.push(Number(part) - 1);
    }
  });

  return result;
}


// DESCARGAR
function downloadFile(bytes, name) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
}

</script>

</body>
</html>
